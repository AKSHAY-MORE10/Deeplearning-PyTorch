<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Upload Image</title>
  </head>
  <body>
    <h1>Upload Image</h1>
    <form method="post" enctype="multipart/form-data" action="/upload">
      <input type="file" name="image" accept="image/*" required>
      <button type="submit">Upload</button>
    </form>
  </body>
</html>
